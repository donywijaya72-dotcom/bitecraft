    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }

<body>
    <div id="root"></div>

    <script type="text/babel">
        
        // --- DATA MATERI ---
        const materialData = [
            {

            {

                content: "Bahan mentah harus diolah agar aman dan enak dimakan. Teknik dasar pemanasan basah (Moist Heat):\n1. Boiling (Merebus): Memasak bahan dalam cairan (air/kaldu) yang sudah mendidih.\n2. Steaming (Mengukus): Memasak bahan dengan uap air mendidih.\n\nTeknik pemanasan kering (Dry Heat):\n1. Frying (Menggoreng): Memasak dalam minyak banyak/sedikit.\n2. Baking (Memanggang): Memasak di dalam oven tanpa minyak/air.",
                icon: "🍳"

            {

                icon: "🧼"
            },
            {
                level: "LEVEL 4: ANALISIS",
                title: "Inovasi Pangan Lokal",
                content: "Di Banyuwangi, jagung dan singkong melimpah. Agar disukai generasi muda, kita harus berinovasi. Singkong tidak hanya direbus, tapi bisa diolah menjadi 'Cassava Cheese' atau 'Singkong Thailand' kekinian. Pengolahan inovatif menaikkan nilai ekonomi bahan pangan lokal!",
                icon: "💡"
            }
        ];

        // --- DATA KUIS ---
        const quizData = [
            // MUDAH (5)
            { id: 1, level: "mudah", tipe: "pilihan-ganda",
              pertanyaan: "Bahan pangan yang berasal dari golongan padi-padian atau rumput-rumputan disebut...",
              pilihan: ["Kacang-kacangan", "Umbi-umbian", "Serealia", "Sayuran"],
              jawabanBenar: 2, penjelasan: "Serealia (Gramineae) adalah biji-bijian sumber karbohidrat seperti padi, jagung, dan gandum." },
            { id: 2, level: "mudah", tipe: "pilihan-ganda",
              pertanyaan: "Berikut ini yang termasuk ke dalam kelompok umbi adalah...",
              pilihan: ["Beras, Jagung, Kedelai", "Singkong, Ubi Jalar, Kentang", "Gandum, Sorgum, Beras", "Ketela, Kacang Hijau, Jagung"],

              pertanyaan: "Mencuci tangan dengan sabun sebelum mengolah singkong merupakan contoh penerapan...",

              jawabanBenar: 1, penjelasan: "Higiene fokus pada kebersihan individu (orangnya), sedangkan sanitasi fokus pada lingkungannya." },
            
            // SEDANG (6)
            { id: 6, level: "sedang", tipe: "pilihan-ganda",
              pertanyaan: "Rani ingin membuat olahan ubi jalar yang sehat dan rendah lemak untuk diet ibunya. Teknik pengolahan yang paling tepat dipilih Rani adalah...",
              pilihan: ["Deep Frying (Menggoreng)", "Steaming (Mengukus)", "Sauteing (Menumis)", "Baking dengan banyak mentega"],
              jawabanBenar: 1, penjelasan: "Mengukus tidak menggunakan minyak/lemak tambahan, sehingga kalori lebih terjaga dan nutrisi tidak banyak hilang." },
            { id: 7, level: "sedang", tipe: "pilihan-ganda",
              pertanyaan: "Produk olahan setengah jadi dari serealia gandum yang sering kita konsumsi sehari-hari adalah...",

            { id: 9, level: "sedang", tipe: "pilihan-ganda",
              pertanyaan: "Pemisahan penggunaan talenan untuk memotong daging ayam mentah dan talenan untuk memotong ubi matang bertujuan untuk...",
              pilihan: ["Mencegah pisau cepat tumpul", "Mencegah kontaminasi silang", "Menjaga warna makanan", "Mempercepat proses memasak"],

            { id: 11, level: "sedang", tipe: "pilihan-ganda",
              pertanyaan: "Apa perbedaan utama antara teknik Boiling dan Steaming?",
              pilihan: ["Boiling pakai minyak, Steaming pakai air", "Boiling merendam bahan di air, Steaming menggunakan uapnya", "Boiling untuk sayur, Steaming untuk daging", "Boiling memakan waktu lama, Steaming sangat cepat"],
              jawabanBenar: 1, penjelasan: "Boiling (merebus) bahan tenggelam di air. Steaming (mengukus) bahan tidak menyentuh air, hanya terkena uap." },
            
            // MENANTANG (4)
            { id: 12, level: "menantang", tipe: "pilihan-ganda",
              pertanyaan: "Sebuah kantin sekolah menjual olahan kentang goreng, namun seringkali kentangnya terlalu berminyak dan lembek. Berdasarkan analisis teknik pengolahan, solusi terbaik yang bisa diberikan adalah...",
              pilihan: ["Menambah suhu api menjadi paling besar sejak awal", "Meniriskan kentang matang di atas tisu dapur dan memastikan minyak benar-benar panas sebelum menggoreng", "Mengganti kentang dengan singkong", "Merebus kentang terlebih dahulu sampai hancur baru digoreng"],
              jawabanBenar: 1, penjelasan: "Minyak yang kurang panas membuat bahan menyerap minyak berlebih. Meniriskan di tisu membantu menyerap sisa minyak." },
            { id: 13, level: "menantang", tipe: "pilihan-ganda",
              pertanyaan: "Untuk membuat inovasi 'Kroket Singkong Isi Ayam Teriyaki', tahapan pengolahan yang paling sistematis dan higienis adalah...",
              pilihan: ["Kupas singkong -> kukus -> haluskan -> isi ayam -> bentuk -> goreng", "Cuci singkong -> kupas -> kukus -> haluskan -> isi ayam -> bentuk -> goreng", "Kupas singkong -> cuci -> kukus -> haluskan -> isi ayam -> bentuk -> balur tepung panir -> goreng", "Kukus singkong -> kupas -> cuci -> potong -> goreng"],
              jawabanBenar: 2, penjelasan: "Alur teraman: dikupas, dicuci, dikukus, dihaluskan, diisi, dibalur panir (ciri khas kroket), lalu digoreng." },
            { id: 14, level: "menantang", tipe: "pilihan-ganda",
              pertanyaan: "Saat merancang resep olahan pangan, kita harus memikirkan 'Packaging' (pengemasan). Mengapa olahan 'Singkong Thailand' berkuah santan tidak cocok dikemas menggunakan kertas cokelat pembungkus nasi?",
              pilihan: ["Kertas cokelat harganya terlalu mahal", "Kertas cokelat tidak tahan benda cair sehingga akan bocor", "Warna kertas cokelat membuat makanan terlihat pucat", "Kertas cokelat merusak rasa santan"],
              jawabanBenar: 1, penjelasan: "Kemasan harus disesuaikan dengan tekstur makanan. Kertas nasi tidak kedap air, cocok untuk makanan kering." },
            { id: 15, level: "menantang", tipe: "pilihan-ganda",
              pertanyaan: "Dalam konsep 'Deep Learning', Budi ingin membuat produk dari ubi ungu matang sisa kemarin. Untuk menjamin keamanan pangannya sebelum diolah ulang, apa yang harus dianalisis Budi pertama kali?",
              pilihan: ["Cek apakah ubi tersebut masih hangat", "Cek perubahan bau, warna, dan lendir (tanda basi) pada ubi", "Langsung digoreng ulang dengan api besar agar bakteri mati", "Mencampurnya dengan banyak gula agar rasa asammnya hilang"],
              jawabanBenar: 1, penjelasan: "Keamanan pangan (Food Safety) mengharuskan kita mengecek kondisi fisik (bau, tekstur berlendir, rasa asam) sebelum mengolah bahan sisa." }
        ];

        
        const SvgIcon = ({ name, className = "w-6 h-6" }) => {
            const icons = {
                home: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />,
                book: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />,
                target: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />,
                play: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />,
                award: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />,
                user: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />,
                heart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />,
                check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />,
                x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
            };
            return (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    {icons[name]}
                </svg>
            );
        };

        const calculateLevel = (xp) => {
            if(xp >= 500) return "Master";
            if(xp >= 300) return "Analyst";
            if(xp >= 150) return "Solver";
            if(xp >= 50) return "Learner";
            return "Explorer";
        };


        const App = () => {
            const [screen, setScreen] = React.useState("login");
            const [user, setUser] = React.useState({ name: "", xp: 0, badges: [] });
            const [quizState, setQuizState] = React.useState({
                currentIndex: 0,
                energy: 3,
                score: 0,
                answers: [], // {id, userAns, correct, xpEarned}
                isFinished: false
            });

            // Load from LocalStorage
            React.useEffect(() => {
                const saved = localStorage.getItem("bitecraft_data");
                if (saved) {
                    const parsed = JSON.parse(saved);
                    setUser(parsed.user);
                    if(parsed.user.name) setScreen("home");
                }
            }, []);

            // Save to LocalStorage
            React.useEffect(() => {
                if (user.name) {
                    localStorage.setItem("bitecraft_data", JSON.stringify({ user }));
                }
            }, [user]);

            const addXP = (amount, reason) => {
                setUser(prev => ({ ...prev, xp: prev.xp + amount }));
                // In a real app, we'd show a toast here
            };

            const addBadge = (badgeName) => {
                if (!user.badges.includes(badgeName)) {
                    setUser(prev => ({ ...prev, badges: [...prev.badges, badgeName] }));
                }
            };

            const resetProgress = () => {
                if(window.confirm("Apakah kamu yakin ingin menghapus seluruh progres belajar?")) {
                    localStorage.removeItem("bitecraft_data");
                    setUser({ name: "", xp: 0, badges: [] });
                    setQuizState({currentIndex: 0, energy: 3, score: 0, answers: [], isFinished: false});
                    setScreen("login");
                }
            };

            // Navbar Component
            const Navbar = () => (
                <nav className="bg-indigo-600 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
                    <div className="flex items-center gap-2 font-bold text-xl cursor-pointer" onClick={() => setScreen("home")}>
                        <span className="bg-amber-400 text-indigo-900 rounded-lg p-1">BC</span>
                        BiteCraft
                    </div>
                    {user.name && (
                        <div className="flex gap-4 items-center text-sm md:text-base">
                            <div className="hidden md:flex items-center gap-1 bg-indigo-500 px-3 py-1 rounded-full">
                                <SvgIcon name="target" className="w-4 h-4 text-amber-300" />
                                <span>Lvl: {calculateLevel(user.xp)}</span>
                            </div>
                            <div className="flex items-center gap-1 bg-indigo-500 px-3 py-1 rounded-full font-bold">
                                <span>{user.xp} XP</span>
                            </div>
                        </div>
                    )}
                </nav>
            );

            // Bottom Navigation for Mobile
            const BottomNav = () => (
                <div className="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-3 md:hidden z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                    <button onClick={()=>setScreen("home")} className={`flex flex-col items-center ${screen==='home'?'text-indigo-600':'text-gray-400'}`}>
                        <SvgIcon name="home" /> <span className="text-xs mt-1">Beranda</span>
                    </button>
                    <button onClick={()=>setScreen("material")} className={`flex flex-col items-center ${screen==='material'?'text-indigo-600':'text-gray-400'}`}>
                        <SvgIcon name="book" /> <span className="text-xs mt-1">Materi</span>
                    </button>
                    <button onClick={()=>setScreen("quiz_intro")} className={`flex flex-col items-center ${screen.includes('quiz')?'text-indigo-600':'text-gray-400'}`}>
                        <SvgIcon name="play" /> <span className="text-xs mt-1">Misi</span>
                    </button>
                    <button onClick={()=>setScreen("profile")} className={`flex flex-col items-center ${screen==='profile'?'text-indigo-600':'text-gray-400'}`}>
                        <SvgIcon name="user" /> <span className="text-xs mt-1">Profil</span>
                    </button>
                </div>
            );


            if (screen === "login") {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-indigo-500 to-teal-400 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
                            <div className="w-20 h-20 bg-amber-400 rounded-2xl mx-auto flex items-center justify-center mb-6 rotate-12 shadow-lg">
                                <span className="text-4xl">🚀</span>
                            </div>
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">BiteCraft</h1>
                            <p className="text-gray-500 mb-8">Eksplorasi Pangan, Taklukkan Misi!</p>
                            
                            <input 
                                type="text" 
                                placeholder="Masukkan nama panggilanmu..." 
                                className="w-full p-4 border-2 border-gray-200 rounded-xl mb-4 focus:outline-none focus:border-indigo-500 text-center font-semibold text-lg"
                                onKeyDown={(e) => {
                                    if(e.key === 'Enter' && e.target.value.trim() !== '') {
                                        setUser(prev => ({...prev, name: e.target.value.trim()}));
                                        setScreen("home");
                                    }
                                }}
                                id="nameInput"
                            />
                            <button 
                                onClick={() => {
                                    const val = document.getElementById("nameInput").value.trim();
                                    if(val) { setUser(prev => ({...prev, name: val})); setScreen("home"); }
                                }}
                                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition transform hover:scale-105">
                                Mulai Petualangan
                            </button>
                        </div>
                    </div>
                );
            }

            const renderHome = () => (
                <div className="p-4 md:p-8 max-w-4xl mx-auto pb-24">
                    <div className="bg-gradient-to-r from-indigo-500 to-indigo-700 rounded-3xl p-6 md:p-10 text-white shadow-xl relative overflow-hidden mb-8">
                        <div className="relative z-10">
                            <h2 className="text-3xl md:text-4xl font-bold mb-2">Halo, {user.name}! 👋</h2>
                            <p className="text-indigo-100 text-lg md:text-xl max-w-lg mb-6">Siap menaklukkan tantangan Pengolahan Pangan hari ini? Pahami konsepnya, bukan sekadar hafalan.</p>
                            <div className="flex gap-4">
                                <button onClick={()=>setScreen("objectives")} className="bg-amber-400 hover:bg-amber-500 text-indigo-900 font-bold py-3 px-6 rounded-xl transition">
                                    Mulai Belajar
                                </button>
                                <button onClick={()=>setScreen("help")} className="bg-white/20 hover:bg-white/30 text-white font-semibold py-3 px-6 rounded-xl backdrop-blur transition">
                                    Petunjuk
                                </button>
                            </div>
                        </div>
                        <div className="absolute right-[-20px] bottom-[-20px] opacity-20 md:opacity-50">
                            <span className="text-[150px]">🌾</span>
                        </div>
                    </div>

                    <h3 className="text-xl font-bold text-gray-800 mb-4">Navigasi Misi</h3>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div onClick={()=>setScreen("objectives")} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-md transition text-center group">
                            <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition">
                                <SvgIcon name="target" />
                            </div>
                            <span className="font-semibold text-gray-700">Tujuan</span>
                        </div>
                        <div onClick={()=>setScreen("material")} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-md transition text-center group">
                            <div className="w-12 h-12 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition">
                                <SvgIcon name="book" />
                            </div>
                            <span className="font-semibold text-gray-700">Materi</span>
                        </div>
                        <div onClick={()=>setScreen("quiz_intro")} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-md transition text-center group">
                            <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition">
                                <SvgIcon name="play" />
                            </div>
                            <span className="font-semibold text-gray-700">Tantangan</span>
                        </div>
                        <div onClick={()=>setScreen("developer")} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-md transition text-center group">
                            <div className="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition">

                    {screen !== "login" && <Navbar />}
                    
                    <main className="animate-fade-in">
                        {screen === "home" && renderHome()}
                        {screen === "objectives" && renderObjectives()}
                        {screen === "help" && renderHelp()}
                        {screen === "material" && <MaterialScreen />}
                        {screen === "quiz_intro" && <QuizIntro />}
                        {screen === "quiz_play" && <QuizPlay />}
                        {screen === "quiz_failed" && <QuizFailed />}
                        {screen === "quiz_result" && <QuizResult />}
                        {screen === "review" && <ReviewAnswers />}
                        {screen === "reflection" && <ReflectionScreen />}
                        {screen === "profile" && <ProfileScreen />}
                        {screen === "developer" && <DeveloperScreen />}
                    </main>

                    {screen !== "login" && !screen.includes("quiz_") && <BottomNav />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <style>
        /* Simple Custom Animations */
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.4s ease-out; }
    </style>
</body>
</html>
